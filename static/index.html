<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- A host arrives on ?id=<qr_code>, so the landing URL carries a
       credential. Browsers default to strict-origin-when-cross-origin, which
       already withholds it; stating no-referrer makes that a guarantee rather
       than a default, and costs nothing as the app links nowhere outbound. -->
  <meta name="referrer" content="no-referrer">
  <title>QR Conquest</title>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a855f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon-192x192.png">
<!-- Debug-features flag. Defaults to false; the server rewrites this to true
     when the DEBUG_FEATURES environment variable is enabled. Gates the mobile
     console viewer and the dev GPS simulator (dev-gps.js). -->
<script>window.QRC_DEBUG_FEATURES = false;</script>
<!-- Abuse-reporting address. Defaults to empty, which hides the reporting
     route entirely; the server rewrites this with the address configured by
     the ABUSE_CONTACT_EMAIL environment variable or the site admin panel. -->
<script>window.QRC_ABUSE_CONTACT = "";</script>
<!-- Live-events WebSocket. Defaults to true; the server rewrites this to false
     when LIVE_EVENT_SOCKET is switched off, on a host that cannot carry one.
     Either way the same events reach the app on its poll of the game. -->
<script>window.QRC_LIVE_EVENT_SOCKET = true;</script>
<!-- How many days after a game ends before it is deleted. Defaults to the
     server's own default; the server rewrites this with the value the
     GAME_RETENTION_DAYS environment variable actually set, so the privacy
     notice quotes this deployment's real retention rule. -->
<script>window.QRC_RETENTION_DAYS = 30;</script>
<script src="dev-gps.js"></script>
<script>
  // The offline-capture service worker has been removed; unregister any
  // copies still installed from previous versions of the app
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.getRegistrations()
        .then(registrations => {
          registrations.forEach(registration => registration.unregister());
        })
        .catch(error => {
          console.error('ServiceWorker cleanup failed: ', error);
        });
    });
  }
</script>
  <!-- Front-end libraries are served from this app rather than a CDN, so the
       game keeps working on the patchy mobile data players are usually on.
       See tools/vendor-assets.js and "Front-end libraries" in the README. -->
  <link rel="stylesheet" href="/libs/tailwind.css"/>
  <link rel="stylesheet" href="/libs/leaflet.css"/>
  <!-- Lucide Icons -->
  <script src="/libs/lucide.min.js"></script>
  <script src="/libs/leaflet.js"></script>
  <script>
    // Add comprehensive error handling
    window.onerror = function(msg, url, line, col, error) {
      console.error('Global error caught:', msg, 'at', url, ':', line, ':', col);
      document.getElementById('error-container').innerHTML = `
        <div class="p-4 bg-red-100 text-red-700 rounded-md">
          <h3 class="font-bold">JavaScript Error</h3>
          <p>${msg}</p>
          <p>Line: ${line}, Col: ${col}</p>
          <p>File: ${url}</p>
        </div>
      `;
      document.getElementById('error-container').style.display = 'block';
      return false;
    };

    // Add detailed logging for debugging
    console.log('Document loaded, waiting for DOM content to load');
  </script>
  <link rel="stylesheet" href="site.css"/>
</head>
<body class="bg-gray-100">
  <div id="error-container" style="display: none;" class="max-w-md mx-auto mt-4"></div>
  <!-- The notification container is created on demand by notification.js so it
       stacks above modal backdrops -->
  <div id="root">
    <!-- Loading indicator that will be replaced by JavaScript -->
    <div class="flex items-center justify-center h-screen">
      <div class="animate-spin h-12 w-12 border-4 border-blue-600 rounded-full border-t-transparent"></div>
      <p class="ml-4">Loading QR Conquest...</p>
    </div>
  </div>

  <!-- Load app js after DOM content is loaded -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM content loaded, loading app JavaScript files');

    // Function to load scripts in sequence
    function loadScript(src, callback) {
      var script = document.createElement('script');
      script.src = src;
      script.onload = callback;
      script.onerror = function() {
        console.error('Failed to load ' + src);
        document.getElementById('error-container').innerHTML = `
          <div class="p-4 bg-red-100 text-red-700 rounded-md">
            <h3 class="font-bold">Script Loading Error</h3>
            <p>Failed to load ${src}</p>
          </div>
        `;
        document.getElementById('error-container').style.display = 'block';
      };
      document.body.appendChild(script);
    }

    // Load scripts in sequence, ensuring dependencies are respected
		loadScript('notification.js', function() {
			loadScript('core.js', function() {
				loadScript('ui.js', function() {
					loadScript('host.js', function() {
            loadScript('site-admin.js', function() {
              console.log('All app scripts loaded successfully');
              initializeApp();
            });
					});
				});
			});
		});
  });

  // Initialize Lucide icons when the window loads
  window.addEventListener('load', function() {
    console.log('Window loaded');
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      console.log('Lucide found, creating icons');
      window.lucide.createIcons();
    } else {
      console.error('Lucide icons library not found or createIcons function not available');
    }
  });
</script>
</body>
</html>
